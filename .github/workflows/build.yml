name: Build and release DFRDisplayKm

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          # The WDK link should be re-checked against Microsoft's current WDK page.
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2128854" -OutFile wdksetup.exe
          $p = Start-Process -FilePath .\wdksetup.exe -ArgumentList "/quiet /norestart" -Wait -PassThru
          Write-Host "wdksetup exit code: $($p.ExitCode)"
          # Wait until any Windows Kit installer work has finished
          while (Get-Process -Name msiexec, wdksetup -ErrorAction SilentlyContinue) { Start-Sleep -Seconds 15 }
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "Inf2Cat.exe" -ErrorAction SilentlyContinue | ForEach-Object FullName
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | ForEach-Object FullName
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -Directory | ForEach-Object Name

      - name: Build solution
        shell: pwsh
        run: msbuild DFRDisplayKm.sln /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /m /verbosity:minimal

      - name: Package driver with test-signed catalog
        shell: pwsh
        run: |
          $wdk = "C:\Program Files (x86)\Windows Kits\10"
          $inf2cat  = Get-ChildItem "$wdk\bin" -Recurse -Filter Inf2Cat.exe  | Where-Object FullName -match '\\x86\\' | Select-Object -First 1
          $signtool = Get-ChildItem "$wdk\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\' | Select-Object -First 1
          $wdf      = Get-ChildItem "$wdk" -Recurse -Filter "WdfCoInstaller*.dll" -ErrorAction SilentlyContinue | Where-Object FullName -match '\\x64\\' | Select-Object -First 1
          if (-not $wdf) { Get-ChildItem "$wdk" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | Select-Object -First 30 FullName | Format-Table -AutoSize | Out-String | Write-Host }
          $sys      = Get-ChildItem build -Recurse -Filter DFRDisplayKm.sys | Select-Object -First 1
          # WDK writes the stamped INF to intermediate\..., not build\...
          $inf      = Get-ChildItem . -Recurse -Filter DFRDisplayKm.inf -ErrorAction SilentlyContinue | Where-Object FullName -match 'intermediate' | Select-Object -First 1
          Write-Host "inf2cat=$($inf2cat.FullName) signtool=$($signtool.FullName) wdf=$($wdf.FullName) sys=$($sys.FullName) inf=$($inf.FullName)"
          if (-not ($inf2cat -and $signtool -and $sys -and $inf)) { throw "Missing WDK tools or build outputs" }
          if (Select-String -Path $inf.FullName -Pattern '\$(ARCH|KMDFVERSION|KMDFCOINSTALLERVERSION)\$') { throw "INF was not stamped by the WDK" }

          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $sys.FullName, $inf.FullName -Destination package
          Copy-Item "src\DFRDisplayKm\DFRUsbCcgp.inf" -Destination package
          if ($wdf) {
            Copy-Item $wdf.FullName -Destination package
          } else {
            # KMDF is in-box on Windows 10/11; the coinstaller is only for older systems.
            Write-Warning "WdfCoInstaller not found in WDK; removing coinstaller lines from packaged INF"
            $lines = Get-Content package\DFRDisplayKm.inf | Where-Object { $_ -notmatch 'CoInstaller' }
            Set-Content -Path package\DFRDisplayKm.inf -Value $lines
          }

          & $inf2cat.FullName /driver:"$PWD\package" /os:10_X64 /verbose
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed" }

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=DFRDisplayKm Test" -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath DFRDisplayKm-TestCert.cer | Out-Null
          $files = @("package\DFRDisplayKm.sys") + (Get-ChildItem package -Filter *.cat | ForEach-Object FullName)
          & $signtool.FullName sign /v /fd SHA256 /sha1 $cert.Thumbprint $files
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          $dist = "DFRDisplayKm-Install"
          New-Item -ItemType Directory -Force "$dist\package" | Out-Null
          Copy-Item package\* "$dist\package"
          Copy-Item DFRDisplayKm-TestCert.cer, installer\Install.cmd -Destination $dist
          $exe = Get-ChildItem build -Recurse -Filter DFRDisplayUm.Utility.Console.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            New-Item -ItemType Directory -Force "$dist\test" | Out-Null
            Copy-Item "$($exe.DirectoryName)\*" "$dist\test" -Recurse
            Copy-Item installer\TEST-TOUCHBAR.txt "$dist\test"
          } else {
            Write-Warning "Console test utility was not built"
          }
          Compress-Archive -Path $dist -DestinationPath DFRDisplayKm-Install.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFRDisplayKm-Install
          path: DFRDisplayKm-Install.zip

      - name: Publish GitHub Release
        # Release on tag pushes, or on master commits whose message contains [release]
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          files: DFRDisplayKm-Install.zip
          generate_release_notes: true
